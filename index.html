<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      content="width=device-width, initial-scale=1.0, shrink-to-fit=no, viewport-fit=cover"
      name="viewport"
    />
    <title>Home - excalc</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <script defer src="/static/theme.js"></script>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="https://t3tra.dev/excalc">excalc</a>
        </div>
      </nav>
    </header>
    <div class="container">
      <textarea id="editor" oninput="updatePreview()"></textarea>
      <div id="preview"></div>
      <div id="evalute" class="card">
        <div class="card-body">
          <p>Evalute</p>
          <div
            class="btn-group"
            role="group"
            aria-label="pyodide-sympy exprs"
            id="funcs"
          >
            <button
              type="button"
              class="btn btn-primary"
              disabled
              onclick="simplify()"
            >
              simplify
            </button>
            <button
              type="button"
              class="btn btn-primary"
              disabled
              onclick="solve(document.getElementById('solve-arg').value)"
            >
              solve<input
                value="x"
                id="solve-arg"
                minlength="1"
                maxlength="1"
                style="width: 1em"
              />
            </button>
            <button
              type="button"
              class="btn btn-primary"
              disabled
              onclick="expand()"
            >
              expand
            </button>
            <button
              type="button"
              class="btn btn-primary"
              disabled
              onclick="factor()"
            >
              factor
            </button>
            <button
              type="button"
              class="btn btn-primary"
              disabled
              onclick="apart()"
            >
              apart
            </button>
            <button
              type="button"
              class="btn btn-primary"
              disabled
              onclick="trigsimp()"
            >
              trigsimp
            </button>
          </div>
          <p style="margin-top: 1em">Result</p>
          <div id="result-preview"></div>
          <p>Log</p>
          <textarea id="log-preview" disabled>[INFO] Initializing...</textarea>
          <button class="btn btn-danger" onclick="clearLog()">
            Clear All Log
          </button>
        </div>
      </div>
      <br />
      <div id="share" class="card">
        <div class="card-body">
          <p>Share</p>
          <button class="btn btn-primary" onclick="copyInput()">
            Copy input
          </button>
          <button class="btn btn-primary" onclick="copyLink()">Copy URL</button>
          <button class="btn btn-primary" onclick="download()">
            Save as image(.svg)
          </button>
        </div>
      </div>
      <br />
      <div id="docs" class="card">
        <div class="card-body">
          <p>Docs</p>
          <p>simplify: 式の単純化</p>
          <p>solve: 方程式の解</p>
          <p>expand: 式の展開</p>
          <p>factor: 式の因数分解</p>
          <p>apart: 式の部分分数分解</p>
          <p>trigsimp: 三角関数の単純化</p>
        </div>
      </div>

      <script defer src="/static/main.js"></script>
      <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
      <script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?version=4.8.0&features=es6"></script>
      <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    </div>
    <footer></footer>
    <div
      class="btn-group dropup"
      style="position: fixed; bottom: 16px; right: 16px"
    >
      <button
        type="button"
        class="btn btn-secondary dropdown-toggle"
        data-bs-toggle="dropdown"
        aria-expanded="false"
      >
        <i class="bi bi-circle-half" id="theme-icon"></i>
      </button>
      <ul class="dropdown-menu">
        <li>
          <button
            class="dropdown-item"
            type="button"
            onclick="setTheme('system')"
          >
            <i class="bi bi-circle-half"></i> System
          </button>
        </li>
        <li>
          <button
            class="dropdown-item"
            type="button"
            onclick="setTheme('light')"
          >
            <i class="bi bi-brightness-high-fill"></i> Light
          </button>
        </li>
        <li>
          <button
            class="dropdown-item"
            type="button"
            onclick="setTheme('dark')"
          >
            <i class="bi bi-moon-stars-fill"></i> Dark
          </button>
        </li>
      </ul>
    </div>
  </body>
</html>
